[package]
name = "plimsoll-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Plimsoll HTTP server: health, metrics and the SQL endpoint."

[dependencies]
plimsoll-core.workspace = true
plimsoll-connectors.workspace = true
plimsoll-control.workspace = true
# ADR 0004: axum without default features (no tracing/form/query extras).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { workspace = true, features = ["net", "signal"] }
thiserror.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
# ADR 0021: SHA-256 for token digests. Already in the build as the rustls
# provider (ADR 0015), so no new crate.
ring = "0.17"
# ADR 0031: OTLP/HTTP trace export. Same reqwest line and features as the
# catalog client (ADR 0015), so no new crate in the build.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }
# Paused clock for drain timing tests.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
