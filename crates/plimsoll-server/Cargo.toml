[package]
name = "plimsoll-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Plimsoll HTTP server: health, metrics and the SQL endpoint."

[dependencies]
plimsoll-core.workspace = true
plimsoll-connectors.workspace = true
plimsoll-control.workspace = true
# ADR 0004: axum without default features (no tracing/form/query extras).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { workspace = true, features = ["net", "signal"] }
thiserror.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
# ADR 0021: SHA-256 for token digests. Already in the build as the rustls
# provider (ADR 0015), so no new crate.
ring = "0.17"
# ADR 0031: OTLP/HTTP trace export. Same reqwest line and features as the
# catalog client (ADR 0015), so no new crate in the build.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
# ADR 0099: in-process TLS for the query API. Already in the tree through
# reqwest's rustls (ring provider); no new crates.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
# ADR 0124: Arrow Flight SQL. arrow-flight is the arrow line DataFusion
# already builds; tonic/prost are its gRPC stack (hyper, h2, tower and
# rustls are already in the tree).
arrow-flight = { version = "59.3.2", default-features = false, features = ["flight-sql"] }
tonic = { version = "0.14", default-features = false, features = ["server", "router", "tls-ring"] }
prost = "0.14"
base64 = "0.22"
tower = { version = "0.5", default-features = false, features = ["util"] }

[dev-dependencies]
tonic = { version = "0.14", default-features = false, features = ["channel"] }
# Paused clock for drain timing tests.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
