[package]
name = "plimsoll-control"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Plimsoll control plane: catalog client, governance (admission, registry), system tables."

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
# ADR 0008: HTTP client for the Iceberg REST catalog (rustls, no OpenSSL).
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "net"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }

[lints]
workspace = true
