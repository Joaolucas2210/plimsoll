[package]
name = "plimsoll-control"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Plimsoll control plane: catalog client, governance (admission, registry), system tables."

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
# ADR 0008/0015: HTTP client for the Iceberg REST catalog. Same reqwest line
# and TLS features as object_store, so the binary has one HTTP/TLS stack.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "net"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }

[lints]
workspace = true
