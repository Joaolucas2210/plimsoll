[package]
name = "plimsoll-connectors"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
plimsoll-core.workspace = true
datafusion.workspace = true
thiserror.workspace = true
async-trait.workspace = true
futures.workspace = true
tokio.workspace = true
# ADR 0006: thin async Postgres client, no ORM/pool; chrono is already in the Arrow tree.
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime", "with-chrono-0_4"] }
chrono = { version = "0.4", default-features = false }
# ADR 0007: Iceberg manifests are Avro; deflate is built in (no codec features).
apache-avro = { version = "0.22", default-features = false }
serde_json.workspace = true
bytes = "1"
# ADR 0058: worker fragments over HTTP. Same reqwest line and TLS features as
# object_store and the catalog client (ADR 0015): no new crate in the build.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
# ADR 0017: Iceberg v3 deletion vectors are portable 64-bit Roaring bitmaps.
roaring = "0.12"

[lints]
workspace = true
