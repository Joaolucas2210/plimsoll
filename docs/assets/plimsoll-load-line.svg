<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">A query's path through Plimsoll and where overload becomes a typed error</title>
  <desc id="desc">A SQL request is authenticated, then admitted by the control plane or rejected with 429. Admitted queries are planned against the Iceberg catalog with grants applied, then executed in the compute plane where every operator reserves memory from one process-wide ceiling: crossing it fails that query with 422 while other queries continue. One deadline covers queue and execution and ends with 504. Every path releases the slot and the memory.</desc>
  <rect width="1200" height="420" rx="16" fill="#F5F7FA"/>
  <text x="34" y="44" fill="#0E1A2B" font-family="system-ui, sans-serif" font-size="23" font-weight="700">The query fails. The node doesn't.</text>
  <text x="34" y="70" fill="#3A4A5E" font-family="system-ui, sans-serif" font-size="15">One process; overload ends a single query with a typed error at one of three points.</text>

  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0E1A2B"/></marker></defs>

  <g fill="#FFFFFF" stroke="#0E1A2B" stroke-width="2">
    <rect x="34" y="118" width="150" height="76" rx="8"/>
    <rect x="234" y="118" width="190" height="76" rx="8"/>
    <rect x="474" y="118" width="190" height="76" rx="8"/>
    <rect x="714" y="118" width="250" height="76" rx="8"/>
    <rect x="1014" y="118" width="152" height="76" rx="8"/>
  </g>
  <g fill="#0E1A2B" font-family="system-ui, sans-serif" font-size="17" font-weight="650" text-anchor="middle">
    <text x="109" y="150">SQL request</text>
    <text x="329" y="150">Admission</text>
    <text x="569" y="150">Plan</text>
    <text x="839" y="150">Execute</text>
    <text x="1090" y="150">Result</text>
  </g>
  <g fill="#3A4A5E" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    <text x="109" y="174">HTTP · Flight SQL</text>
    <text x="329" y="174">global · group · user limits</text>
    <text x="569" y="174">catalog · grants · pruning</text>
    <text x="839" y="174">DataFusion under CeilingPool</text>
    <text x="1090" y="174">JSON · Arrow IPC</text>
  </g>
  <path d="M184 156h40m200 0h40m200 0h40m250 0h40" stroke="#0E1A2B" stroke-width="3" marker-end="url(#a)"/>

  <text x="234" y="104" fill="#1F5F99" font-family="ui-monospace, monospace" font-size="13">CONTROL PLANE — whether and where</text>
  <text x="714" y="104" fill="#1F5F99" font-family="ui-monospace, monospace" font-size="13">COMPUTE PLANE — how, under the line</text>

  <path d="M329 196v58m510-58v18m0 26v14" stroke="#0E1A2B" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="244" y="256" width="170" height="50" rx="7" fill="#FFF4E5" stroke="#B5651D" stroke-width="2"/>
  <text x="329" y="279" text-anchor="middle" fill="#7A3E0C" font-family="ui-monospace, monospace" font-size="15" font-weight="700">429 queue_full</text>
  <text x="329" y="297" text-anchor="middle" fill="#7A3E0C" font-family="system-ui, sans-serif" font-size="12">rejected, not thrashing</text>

  <path d="M714 236h250" stroke="#F2A541" stroke-width="5" stroke-linecap="round"/>
  <text x="839" y="228" text-anchor="middle" fill="#7A3E0C" font-family="system-ui, sans-serif" font-size="12" font-weight="650">memory ceiling — the load line</text>
  <rect x="724" y="256" width="230" height="50" rx="7" fill="#FFF4E5" stroke="#B5651D" stroke-width="2"/>
  <text x="839" y="279" text-anchor="middle" fill="#7A3E0C" font-family="ui-monospace, monospace" font-size="15" font-weight="700">422 memory_limit_exceeded</text>
  <text x="839" y="297" text-anchor="middle" fill="#7A3E0C" font-family="system-ui, sans-serif" font-size="12">this query only; spill first if configured</text>

  <path d="M234 334h730" stroke="#3A4A5E" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="234" y="326" fill="#3A4A5E" font-family="system-ui, sans-serif" font-size="12">one deadline: queue wait + execution</text>
  <rect x="984" y="314" width="182" height="40" rx="7" fill="#FFF4E5" stroke="#B5651D" stroke-width="2"/>
  <text x="1075" y="339" text-anchor="middle" fill="#7A3E0C" font-family="ui-monospace, monospace" font-size="15" font-weight="700">504 query_timeout</text>

  <text x="34" y="392" fill="#0E1A2B" font-family="system-ui, sans-serif" font-size="14">Every path releases the slot and the memory, and is recorded in system.runtime.queries, /metrics, one log line and a trace.</text>
</svg>
