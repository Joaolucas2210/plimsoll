name: interop

# Merge-on-read interop against the reference implementation: Spark position
# deletes (ADR 0014), Iceberg Java equality deletes (ADR 0016) and v3
# deletion vectors (ADR 0017). Heavy (Spark image + JVM), so it runs only
# when the Iceberg reader changes, weekly, or on demand (ADR 0011).
on:
  push:
    branches: [main]
    paths:
      - "crates/plimsoll-connectors/src/iceberg*/**"
      - "crates/plimsoll-connectors/src/iceberg.rs"
      - "crates/plimsoll-connectors/tests/iceberg.rs"
      # Distribution (ADR 0058–0065) is validated against the same tables.
      - "crates/plimsoll-connectors/src/remote.rs"
      - "crates/plimsoll-server/tests/distributed.rs"
      - "scripts/spark_mor_fixture.sh"
      - ".github/workflows/interop.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: interop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  spark-mor:
    name: Iceberg merge-on-read (Spark + Java writers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: write the table with Spark (background)
        run: nohup scripts/spark_mor_fixture.sh "$RUNNER_TEMP/wh" > "$RUNNER_TEMP/mor.env" 2> "$RUNNER_TEMP/mor.err" &
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: plimsoll
          save-if: false
      - run: cargo test --workspace --no-run
      - name: wait for Spark
        run: |
          for i in $(seq 1 180); do grep -q PLIMSOLL_ICEBERG_DV "$RUNNER_TEMP/mor.env" 2>/dev/null && break; sleep 2; done
          cat "$RUNNER_TEMP/mor.err" >&2 || true
          cat "$RUNNER_TEMP/mor.env" >> "$GITHUB_ENV"
      - run: |
          test -n "$PLIMSOLL_ICEBERG_MOR" && test -n "$PLIMSOLL_ICEBERG_EQ" && test -n "$PLIMSOLL_ICEBERG_DV" && test -n "$PLIMSOLL_ICEBERG_EVOLVED" && test -n "$PLIMSOLL_ICEBERG_NESTED" && test -n "$PLIMSOLL_ICEBERG_IMPORTED" && test -n "$PLIMSOLL_ICEBERG_BUCKETED" && test -n "$PLIMSOLL_ICEBERG_MONEY"
          cargo test --workspace -- --ignored reads_a_spark_merge_on_read_table reads_reference_equality_deletes reads_reference_deletion_vectors time_travels_a_spark_table reads_an_evolved_spark_table reads_nested_spark_types reads_files_imported_without_field_ids prunes_spark_bucket_and_truncate_partitions prunes_spark_decimal_columns distributed_scans_match_local_ones shuffles_survive_a_lost_worker workers_govern_fragments_and_report_health
