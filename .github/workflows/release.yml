name: release

# ADR 0125: a `v*` tag publishes the binaries and the image. Tags only, so
# it costs nothing between releases (ADR 0011). The tag must match the
# workspace version and have a CHANGELOG section. `workflow_dispatch`
# builds everything without publishing, to try the job before a tag
# (ADR 0132).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # the GitHub release
  packages: write # the image on ghcr.io
  id-token: write # keyless signatures (ADR 0131)

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # ADR 0132: arm64 cross-compiled here, at native speed.
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
  CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  release:
    name: binaries + image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: tag matches the version and the changelog
        run: |
          # Registries take lowercase names only (the owner has capitals).
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          if [ "$PUBLISH" != true ]; then
            # Dry run: only what the normal CI does not prove (ADR 0132).
            echo "TAG=dry-run" >> "$GITHUB_ENV"
            echo "TARGETS=aarch64-unknown-linux-gnu" >> "$GITHUB_ENV"
            echo "PLATFORMS=linux/arm64" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "TARGETS=x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu" >> "$GITHUB_ENV"
          echo "PLATFORMS=linux/amd64,linux/arm64" >> "$GITHUB_ENV"
          echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          version="${GITHUB_REF_NAME#v}"
          grep -qx "version = \"$version\"" Cargo.toml || { echo "Cargo.toml is not $version" >&2; exit 1; }
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no [$version] section" >&2; exit 1; }

      - name: toolchains
        run: |
          # The libc headers are only a "recommends" of the cross gcc; without
          # them ring's C falls back to the host's headers and fails.
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu

      # Compiled dependencies, per target (ADR 0134). Saved only from
      # `main` (the dry run): GitHub scopes caches by ref, and a tag can read
      # the default branch's but not another tag's.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # One build per platform: the archives and the image hold the same
      # bytes.
      - name: build
        run: |
          for t in $TARGETS; do
            cargo build --release --locked -p plimsoll-server --target "$t"
            arch=$([ "$t" = aarch64-unknown-linux-gnu ] && echo arm64 || echo amd64)
            mkdir -p "dist/$arch" && cp "target/$t/release/plimsoll-server" "dist/$arch/"
          done
          file dist/*/plimsoll-server

      - name: archives
        run: |
          for t in $TARGETS; do
            arch=$([ "$t" = aarch64-unknown-linux-gnu ] && echo arm64 || echo amd64)
            name="plimsoll-server-${TAG}-${t%%-*}-linux-gnu"
            tar czf "$name.tar.gz" -C "dist/$arch" plimsoll-server -C "$GITHUB_WORKSPACE" LICENSE README.md
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          done

      # QEMU only runs the runtime stage's apt-get for arm64; nothing is
      # compiled under emulation.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.release
          platforms: ${{ env.PLATFORMS }}
          push: ${{ env.PUBLISH == 'true' }}
          # SBOM and build provenance attached to the image (ADR 0131).
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.version=${{ env.TAG }}

      # Keyless: the signature names this workflow and tag, logged in
      # Sigstore's transparency log; no key to keep (ADR 0131).
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        if: env.PUBLISH == 'true'
      - name: sign the image and the archives
        if: env.PUBLISH == 'true'
        run: |
          cosign sign --yes "$IMAGE@${{ steps.image.outputs.digest }}"
          for f in plimsoll-server-*.tar.gz; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" plimsoll-server-*.tar.gz*
