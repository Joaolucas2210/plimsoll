name: ci

# ADR 0011: one job, one build, one cache. Docs-only pushes don't run CI.
# ADR 0136: on pull requests the workflow always runs, because `gates + live integration` is a required
# check on main; for a docs-only change the heavy job is skipped, which GitHub counts as passing.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debug info in CI: smaller artifacts, faster links, smaller cache.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo code=true >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" HEAD | grep -qvE '\.md$|^docs/|^LICENSE$'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo "docs-only change: the gates job is skipped"; echo code=false >> "$GITHUB_OUTPUT"
          fi

  secret-scan:
    # gitleaks over the full history with .gitleaks.toml (one allowlisted test literal); image pinned by digest.
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (redacted)
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.18.4@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba
          detect --source /repo --config /repo/.gitleaks.toml --log-opts=--all --redact --no-banner

  ci:
    name: gates + live integration
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        # Throwaway CI container, not a secret.
        env:
          POSTGRES_PASSWORD: plimsoll
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Started first so the JVM and S3 warm up while Rust compiles.
      - name: start S3 (SeaweedFS) and Iceberg REST catalog
        run: |
          docker network create lake
          # admin writes (catalog, fixture); reader is what a vending catalog hands out.
          mkdir -p "$RUNNER_TEMP/s3" && cat > "$RUNNER_TEMP/s3/s3.json" <<'JSON'
          {"identities": [
            {"name": "admin", "credentials": [{"accessKey": "admin", "secretKey": "password"}],
             "actions": ["Admin", "Read", "List", "Write", "Tagging"]},
            {"name": "reader", "credentials": [{"accessKey": "reader", "secretKey": "readersecret"}],
             "actions": ["Read", "List"]}]}
          JSON
          # Small volumes, fixed slot count: by default SeaweedFS derives free
          # slots from runner disk / 30 GB and can run out ("No writable volumes").
          docker run -d --name s3 --network lake -p 8333:8333 -v "$RUNNER_TEMP/s3:/etc/plimsoll:ro" \
            chrislusf/seaweedfs@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860 \
            server -s3 -s3.config=/etc/plimsoll/s3.json -dir=/data \
            -master.volumeSizeLimitMB=64 -volume.max=64
          docker run -d --name rest --network lake -p 8181:8181 \
            -e AWS_ACCESS_KEY_ID=admin -e AWS_SECRET_ACCESS_KEY=password -e AWS_REGION=us-east-1 \
            -e CATALOG_WAREHOUSE=s3://warehouse/ -e CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO \
            -e CATALOG_S3_ENDPOINT=http://s3:8333 -e CATALOG_S3_PATH__STYLE__ACCESS=true \
            apache/iceberg-rest-fixture

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: plimsoll
          # PRs restore main's cache but never write their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      # Builds every test binary once; the live tests below reuse them
      # (always `--workspace`, so feature resolution and artifacts match).
      - run: scripts/gates.sh
      # The README's demo: overload fails one query (422/429/504), the node keeps serving. Reuses the debug build.
      - name: demo (the load line, live)
        run: scripts/demo.sh

      - name: wait for S3 bucket and REST catalog
        run: |
          for i in $(seq 1 60); do
            echo "s3.bucket.create -name warehouse" | docker exec -i s3 weed shell 2>&1 | grep -q "created bucket" && break
            sleep 2
          done
          for i in $(seq 1 60); do curl -sf -o /dev/null localhost:8181/v1/config && exit 0; sleep 2; done
          exit 1
      - name: write fixtures with pyiceberg through the REST catalog
        run: >-
          uv run scripts/iceberg_fixture.py http://localhost:8181
          s3.endpoint=http://localhost:8333 s3.access-key-id=admin
          s3.secret-access-key=password s3.region=us-east-1 | grep ^PLIMSOLL_ >> "$GITHUB_ENV"

      # Ignored tests return early without their env: fail here instead.
      - name: live tests (Postgres, REST catalog, Iceberg on S3, pruning, appends, deletes)
        run: |
          test -n "$PLIMSOLL_ICEBERG_FIXTURE" && test -n "$PLIMSOLL_ICEBERG_EVENTS"
          cargo test --workspace -- --ignored \
            pg_live_roundtrip pg_streams_in_accounted_batches live_rest_catalog reads_a_pyiceberg_table prunes_a_partitioned_pyiceberg_table writes_through_the_rest_catalog writes_on_workers_through_the_rest_catalog
        env:
          PLIMSOLL_PG_URL: postgres://postgres:plimsoll@localhost:5432/postgres
          PLIMSOLL_CATALOG_URI: http://localhost:8181
          # The write test's debug-build futures outgrow the 2 MiB default.
          RUST_MIN_STACK: "8388608"
          AWS_ENDPOINT: http://localhost:8333
          AWS_ALLOW_HTTP: "true"
          AWS_ACCESS_KEY_ID: admin
          AWS_SECRET_ACCESS_KEY: password
          AWS_REGION: us-east-1
      - name: catalog-vended credentials (env keys are wrong on purpose)
        run: cargo test --workspace -- --ignored reads_with_catalog_vended_credentials
        env:
          PLIMSOLL_CATALOG_URI: http://localhost:8181
          PLIMSOLL_TEST_VENDED: reader:readersecret
          AWS_ENDPOINT: http://localhost:8333
          AWS_ALLOW_HTTP: "true"
          AWS_ACCESS_KEY_ID: wrong
          AWS_SECRET_ACCESS_KEY: wrong
          AWS_REGION: us-east-1

      - name: container logs
        if: failure()
        run: docker logs rest 2>&1 | tail -100; docker logs s3 2>&1 | tail -50
