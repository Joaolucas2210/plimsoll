name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  gates:
    name: gates (fmt, clippy, test, arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: scripts/gates.sh

  postgres-live:
    name: postgres federation (live)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        # Throwaway CI container, not a secret.
        env:
          POSTGRES_PASSWORD: plimsoll
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PLIMSOLL_PG_URL: postgres://postgres:plimsoll@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p plimsoll-connectors -- --ignored

  iceberg-interop:
    name: iceberg interop (pyiceberg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: uv run scripts/iceberg_fixture.py "$RUNNER_TEMP/wh" | tail -1 >> "$GITHUB_ENV"
      - run: cargo test -p plimsoll-connectors --test iceberg -- --ignored
