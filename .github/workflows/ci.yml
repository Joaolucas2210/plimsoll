name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  gates:
    name: gates (fmt, clippy, test, arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: scripts/gates.sh

  postgres-live:
    name: postgres federation (live)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        # Throwaway CI container, not a secret.
        env:
          POSTGRES_PASSWORD: plimsoll
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PLIMSOLL_PG_URL: postgres://postgres:plimsoll@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p plimsoll-connectors -- --ignored

  iceberg-interop:
    name: iceberg interop (pyiceberg, REST catalog, S3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: uv run scripts/iceberg_fixture.py "$RUNNER_TEMP/wh" | grep ^PLIMSOLL_ >> "$GITHUB_ENV"
      # The ignored tests return early without their env: make that impossible here.
      - run: |
          test -n "$PLIMSOLL_ICEBERG_FIXTURE" && test -n "$PLIMSOLL_ICEBERG_EVENTS"
          cargo test -p plimsoll-connectors --test iceberg -- --ignored
      # Reference REST catalog with an S3 warehouse (SeaweedFS): no shared
      # filesystem, and Plimsoll reads metadata and data through s3://.
      - name: start SeaweedFS (S3) and apache/iceberg-rest-fixture
        run: |
          docker network create lake
          # admin writes (catalog, fixture); reader is what a vending catalog hands out.
          mkdir -p "$RUNNER_TEMP/s3" && cat > "$RUNNER_TEMP/s3/s3.json" <<'JSON'
          {"identities": [
            {"name": "admin", "credentials": [{"accessKey": "admin", "secretKey": "password"}],
             "actions": ["Admin", "Read", "List", "Write", "Tagging"]},
            {"name": "reader", "credentials": [{"accessKey": "reader", "secretKey": "readersecret"}],
             "actions": ["Read", "List"]}]}
          JSON
          docker run -d --name s3 --network lake -p 8333:8333 -v "$RUNNER_TEMP/s3:/etc/plimsoll:ro" \
            chrislusf/seaweedfs@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860 \
            server -s3 -s3.config=/etc/plimsoll/s3.json -dir=/data
          for i in $(seq 1 60); do
            echo "s3.bucket.create -name warehouse" | docker exec -i s3 weed shell 2>&1 | grep -q "created bucket" && break
            sleep 2
          done
          docker run -d --name rest --network lake -p 8181:8181 \
            -e AWS_ACCESS_KEY_ID=admin -e AWS_SECRET_ACCESS_KEY=password -e AWS_REGION=us-east-1 \
            -e CATALOG_WAREHOUSE=s3://warehouse/ -e CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO \
            -e CATALOG_S3_ENDPOINT=http://s3:8333 -e CATALOG_S3_PATH__STYLE__ACCESS=true \
            apache/iceberg-rest-fixture
          for i in $(seq 1 60); do curl -sf localhost:8181/v1/config && exit 0; sleep 2; done
          docker logs rest; exit 1
      - run: >-
          uv run scripts/iceberg_fixture.py http://localhost:8181
          s3.endpoint=http://localhost:8333 s3.access-key-id=admin
          s3.secret-access-key=password s3.region=us-east-1 | grep ^PLIMSOLL_ >> "$GITHUB_ENV"
      - run: |
          cargo test -p plimsoll-control live_rest_catalog -- --ignored
          cargo test -p plimsoll-connectors --test iceberg -- --ignored
        env:
          PLIMSOLL_CATALOG_URI: http://localhost:8181
          AWS_ENDPOINT: http://localhost:8333
          AWS_ALLOW_HTTP: "true"
          AWS_ACCESS_KEY_ID: admin
          AWS_SECRET_ACCESS_KEY: password
          AWS_REGION: us-east-1
      - name: catalog-vended credentials (env keys are wrong on purpose)
        run: cargo test -p plimsoll-server reads_with_catalog_vended -- --ignored
        env:
          PLIMSOLL_CATALOG_URI: http://localhost:8181
          PLIMSOLL_TEST_VENDED: reader:readersecret
          AWS_ENDPOINT: http://localhost:8333
          AWS_ALLOW_HTTP: "true"
          AWS_ACCESS_KEY_ID: wrong
          AWS_SECRET_ACCESS_KEY: wrong
          AWS_REGION: us-east-1
