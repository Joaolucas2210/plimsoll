name: Bug report
description: Plimsoll behaves differently from the docs (not a vulnerability; those go to Security).
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste tokens, catalog credentials, storage keys or private data; synthetic tables are enough.
        A query that **kills the node**, or a grant, column-deny or row-filter bypass, is a vulnerability: use **Security → Report a vulnerability**.
  - type: input
    id: version
    attributes:
      label: Version
      description: "Release tag or `git rev-parse --short HEAD`, and how you run it (binary, image, Compose)."
    validations: {required: true}
  - type: dropdown
    id: role
    attributes:
      label: Role
      options: [single node, coordinator with workers, several coordinators, worker]
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest SQL or request, and the relevant `PLIMSOLL_*` settings with secrets removed.
      render: shell
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual
      description: "What you expected, what happened: HTTP status, error `code`, the `query` log line (it carries no SQL text)."
    validations: {required: true}
