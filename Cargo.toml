[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"

[workspace.dependencies]
plimsoll-core = { path = "crates/plimsoll-core" }
plimsoll-connectors = { path = "crates/plimsoll-connectors" }
plimsoll-control = { path = "crates/plimsoll-control" }
datafusion = { version = "55", default-features = false, features = ["parquet", "sql", "nested_expressions", "unicode_expressions", "string_expressions", "datetime_expressions"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
thiserror = "2"
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
debug = "line-tables-only"
